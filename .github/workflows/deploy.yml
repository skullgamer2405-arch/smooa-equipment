name: 🚀 Deploy SMO Equipment System

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Lint & Validate
  # ──────────────────────────────────────────────
  validate:
    name: ✅ Validate JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server.js syntax
        run: node --check server.js

      - name: Check public JS files syntax
        run: |
          for f in public/js/*.js; do
            echo "Checking $f..."
            node --check "$f"
          done

  # ──────────────────────────────────────────────
  # JOB 2: Deploy Firebase Hosting + Firestore Rules
  # ──────────────────────────────────────────────
  deploy-firebase:
    name: 🔥 Deploy Firebase Hosting
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploy Hosting เท่านั้น (Firestore rules deploy แยกเมื่อมีการแก้ rules)
      - name: Deploy Firebase Hosting only
        run: |
          firebase deploy \
            --only hosting \
            --project smooa-c1945 \
            --non-interactive

  # ──────────────────────────────────────────────
  # JOB 3: Deploy Backend (Cloud Run)
  # ──────────────────────────────────────────────
  deploy-cloudrun:
    name: ☁️ Deploy Cloud Run (server.js)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # ใช้ --set-env-vars สำหรับ SMTP และ email ทั่วไป
        # ใช้ --update-secrets สำหรับ FIREBASE_SERVICE_ACCOUNT_JSON
        # เพื่อหลีกเลี่ยงปัญหา special characters ใน JSON
        run: |
          gcloud run deploy ais-dev \
            --source . \
            --region asia-southeast1 \
            --project smooa-c1945 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "ADMIN_NOTIFICATION_EMAIL=${{ secrets.ADMIN_NOTIFICATION_EMAIL }},SMTP_HOST=${{ secrets.SMTP_HOST }},SMTP_PORT=${{ secrets.SMTP_PORT }},SMTP_SECURE=${{ secrets.SMTP_SECURE }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASS=${{ secrets.SMTP_PASS }}"

      - name: Set Firebase SA secret on Cloud Run
        # ส่ง FIREBASE_SERVICE_ACCOUNT_JSON แยกผ่าน base64 เพื่อหลีกเลี่ยง quoting issues
        run: |
          SA_B64=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' | base64 -w 0)
          gcloud run services update ais-dev \
            --region asia-southeast1 \
            --project smooa-c1945 \
            --update-env-vars "FIREBASE_SERVICE_ACCOUNT_JSON_B64=${SA_B64}"

  # ──────────────────────────────────────────────
  # JOB 4: สรุปผล Deploy
  # ──────────────────────────────────────────────
  notify:
    name: 📣 Deploy Summary
    needs: [deploy-firebase, deploy-cloudrun]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Hosting | ${{ needs.deploy-firebase.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Run | ${{ needs.deploy-cloudrun.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
