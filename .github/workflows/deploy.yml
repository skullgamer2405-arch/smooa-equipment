name: 🚀 Deploy SMO Equipment System

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Lint & Validate
  # ──────────────────────────────────────────────
  validate:
    name: ✅ Validate JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server.js syntax
        run: node --check server.js

      - name: Check public JS files syntax
        run: |
          for f in public/js/*.js; do
            echo "Checking $f..."
            node --check "$f"
          done

  # ──────────────────────────────────────────────
  # JOB 2: Deploy Firebase Hosting + Firestore Rules
  # (ไม่ deploy Storage Rules เพราะไม่ได้ใช้ Firebase Storage)
  # ──────────────────────────────────────────────
  deploy-firebase:
    name: 🔥 Deploy Firebase Hosting
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting + Firestore Rules
        run: |
          firebase deploy \
            --only hosting,firestore:rules \
            --project smooa-c1945 \
            --non-interactive

  # ──────────────────────────────────────────────
  # JOB 3: Deploy Backend (Cloud Run)
  # ──────────────────────────────────────────────
  deploy-cloudrun:
    name: ☁️ Deploy Cloud Run (server.js)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Write Firebase SA to file (avoid env var quoting issues)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ais-dev \
            --source . \
            --region asia-southeast1 \
            --project smooa-c1945 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "ADMIN_NOTIFICATION_EMAIL=${{ secrets.ADMIN_NOTIFICATION_EMAIL }}" \
            --set-env-vars "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
            --set-env-vars "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
            --set-env-vars "SMTP_SECURE=${{ secrets.SMTP_SECURE }}" \
            --set-env-vars "SMTP_USER=${{ secrets.SMTP_USER }}" \
            --set-env-vars "SMTP_PASS=${{ secrets.SMTP_PASS }}" \
            --set-env-vars "FIREBASE_SERVICE_ACCOUNT_JSON=$(cat /tmp/firebase-sa.json | tr -d '\n')"

  # ──────────────────────────────────────────────
  # JOB 4: สรุปผล Deploy
  # ──────────────────────────────────────────────
  notify:
    name: 📣 Deploy Summary
    needs: [deploy-firebase, deploy-cloudrun]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Hosting | ${{ needs.deploy-firebase.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Run | ${{ needs.deploy-cloudrun.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
