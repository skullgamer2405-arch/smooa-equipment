name: 🚀 Deploy SMO Equipment System

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Lint & Validate
  # ──────────────────────────────────────────────
  validate:
    name: ✅ Validate JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci
      - name: Validate server and frontend
        run: |
          node --check server.js
          npm run typecheck
          npm test
          npm run build
          npm run test:server
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: UI regression and accessibility
        run: npm run test:e2e

  # ──────────────────────────────────────────────
  # JOB 2: Deploy Firebase Hosting
  # ──────────────────────────────────────────────
  deploy-firebase:
    name: 🔥 Deploy Firebase Hosting
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build production UI
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --only hosting \
            --project smooa-c1945 \
            --non-interactive

  # ──────────────────────────────────────────────
  # JOB 3: สรุปผล Deploy
  # ──────────────────────────────────────────────
  notify:
    name: 📣 Deploy Summary
    needs: [deploy-firebase]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Hosting | ${{ needs.deploy-firebase.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
