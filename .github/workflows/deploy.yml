name: Validate official Vercel release

on:
  push:
    branches: [main, preview/ui-vercel-services]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, unit tests and production build
        run: |
          node --check server.js
          npm run typecheck
          npm test
          npm run test:server
          npm run build
      - name: Firestore and Storage policy tests (demo project only)
        run: npm run test:rules
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Responsive, accessibility and workflow regression
        run: npm run test:e2e
      - name: Production browser security policy
        env:
          CHROMIUM_PATH: ""
        run: npm run test:security-browser
      - name: Release handoff
        run: |
          echo "Validation completed. Production is served by the existing Vercel app/api services." >> "$GITHUB_STEP_SUMMARY"
          echo "Configure environment values and finish docs/production-setup.md before promoting a release." >> "$GITHUB_STEP_SUMMARY"
