<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubEquip - ยืมอุปกรณ์สำเร็จ</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f1f0f4",
                        "tertiary-fixed-dim": "#f2bc82",
                        "outline": "#74777f",
                        "secondary-container": "#fea045",
                        "tertiary": "#321b00",
                        "secondary-fixed-dim": "#ffb77a",
                        "surface-variant": "#e3e2e6",
                        "on-tertiary-fixed-variant": "#633f0f",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#adc7f7",
                        "tertiary-fixed": "#ffddba",
                        "surface-bright": "#faf9fd",
                        "on-tertiary-container": "#c6955e",
                        "on-secondary-fixed": "#2e1500",
                        "on-surface-variant": "#43474e",
                        "secondary-fixed": "#ffdcc2",
                        "on-primary-fixed-variant": "#2d476f",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1a1c1e",
                        "on-secondary-fixed-variant": "#6d3a00",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1a365d",
                        "surface-container-highest": "#e3e2e6",
                        "outline-variant": "#c4c6cf",
                        "primary": "#002045",
                        "surface-container-high": "#e9e7eb",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface": "#faf9fd",
                        "on-background": "#1a1c1e",
                        "surface-tint": "#455f88",
                        "inverse-primary": "#adc7f7",
                        "on-tertiary-fixed": "#2b1700",
                        "on-primary-fixed": "#001b3c",
                        "tertiary-container": "#4f2e00",
                        "primary-fixed": "#d6e3ff",
                        "surface-dim": "#dad9dd",
                        "secondary": "#8f4e00",
                        "on-primary-container": "#86a0cd",
                        "surface-container": "#efedf1",
                        "on-secondary-container": "#6d3a00",
                        "inverse-surface": "#2f3033",
                        "surface-container-low": "#f4f3f7",
                        "background": "#faf9fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "md": "24px",
                        "sm": "12px",
                        "gutter": "20px",
                        "xs": "4px",
                        "base": "8px",
                        "xl": "64px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "label-md": ["Sarabun"],
                        "headline-md": ["Prompt"],
                        "headline-lg": ["Prompt"],
                        "body-sm": ["Sarabun"],
                        "body-md": ["Sarabun"],
                        "body-lg": ["Sarabun"],
                        "headline-sm": ["Prompt"],
                        "headline-lg-mobile": ["Prompt"]
                    },
                    "fontSize": {

                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes draw-check {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
        .animate-pop-in {
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }
        .checkmark-path {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: draw-check 0.4s ease-out 0.4s forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
<main class="w-full min-h-screen flex items-center justify-center p-md">
    <div class="bg-surface-container-lowest rounded-xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.05)] w-full max-w-md p-lg text-center flex flex-col items-center border border-surface-container-high relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-secondary-container/10 rounded-full blur-2xl -ml-10 -mb-10 pointer-events-none"></div>
        
        <div class="animate-pop-in w-24 h-24 mb-md relative z-10 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full bg-secondary-container/20 animate-pulse-ring"></div>
            <div class="w-16 h-16 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-md relative z-20">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24">
                    <circle class="opacity-30" cx="12" cy="12" r="10"></circle>
                    <path class="checkmark-path" d="M8 12.5l3 3 5-6"></path>
                </svg>
            </div>
        </div>
        
        <h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-sm relative z-10">
            ส่งคำขอจองสำเร็จ!
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-lg relative z-10 max-w-[280px] mx-auto">
            คำขอของคุณถูกส่งไปยังแอดมินเพื่อรอการอนุมัติแล้ว คุณสามารถติดตามสถานะได้ที่หน้าประวัติการจอง
        </p>
        
        <div class="flex flex-col gap-sm w-full relative z-10">
            <a id="history-link" href="calendar.html" class="w-full flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md rounded-lg py-3 px-4 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">
                ไปที่ประวัติการจอง
            </a>
            <a id="home-link" href="index.html" class="w-full flex items-center justify-center bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md rounded-lg py-3 px-4 hover:bg-surface-container-low transition-colors">
                กลับสู่หน้าหลัก
            </a>
        </div>
    </div>
</main>
<script type="module" src="js/firebase-config.js"></script>
</body>
</html>
